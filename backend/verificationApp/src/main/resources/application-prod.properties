spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:review_system}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

gmail.email=${GMAIL_EMAIL}
gmail.password=${GMAIL_PASSWORD}

blockchain.infura.url=${BLOCKCHAIN_INFURA_URL}
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

ocr.api.key=${OCR_API_KEY}