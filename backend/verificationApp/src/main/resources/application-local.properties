spring.datasource.url=jdbc:mysql://localhost:3306/review_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=appuser
spring.datasource.password=app_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

gmail.email=${GMAIL_EMAIL}
gmail.password=${GMAIL_PASSWORD}

blockchain.infura.url=${BLOCKCHAIN_INFURA_URL}
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

ocr.api.key=${OCR_API_KEY}